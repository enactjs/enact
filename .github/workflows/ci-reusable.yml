name: CI Pipeline

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: 'Git ref to checkout (empty for default merge commit)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [lts, latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout-ref || github.ref }}

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 12.4.2
          runtime: node@${{ matrix.node-version }}
          cache: true
          install: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Clone and setup Enact CLI
        run: |
          git clone --branch=develop --depth 1 https://github.com/enactjs/cli ../cli
          pushd ../cli
          npm install
          npm link
          popd
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test -- --runInBand --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run ESLint
        run: pnpm lint -- --report-unused-disable-directives --max-warnings 0 .

      - name: Validate documentation
        run: pnpm validate-docs

      - name: Build sampler
        run: pnpm run pack
        working-directory: packages/sampler
